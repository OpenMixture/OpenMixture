name: Browser runtime package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: WASM and npm package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
      - name: Match the recorded package manager
        run: npm install --global npm@11.19.0
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Restore Rust build cache
        # Speeds up rebuilds only; later steps still build and verify with --locked.
        # Only main saves, so pull requests cannot replace the shared cache. The cached
        # ~/.cargo/bin lets cargo install reuse the exact binding CLI below.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare the repository Rust target and exact binding CLI
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Verify WASM compilation and JS boundary tests
        run: |
          cargo check --locked -p mixture-wasm --target wasm32-unknown-unknown
          npm ci --prefix packages/runtime --ignore-scripts
          npm test --prefix packages/runtime
          node --test scripts/browser-runtime/candidate.test.mjs scripts/browser-runtime/default-browser.test.mjs scripts/browser-runtime/consumer.test.mjs
      - name: Build the actual npm archive
        run: node scripts/browser-runtime/build.mjs
      - name: Verify public CPU package loading in actual WASM
        run: node scripts/browser-runtime/check-assets.mjs
      - name: Retain package and build identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-runtime-package
          path: |
            target/browser-runtime/*.tgz
            target/browser-runtime/*.sha256
            target/browser-runtime/receipt.json
          retention-days: 30
          if-no-files-found: error
