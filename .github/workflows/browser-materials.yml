name: Browser material qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-materials-${{ github.ref }}
  cancel-in-progress: true
jobs:
  materials:
    name: Chromium WebGPU material matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CC: clang-18
      CXX: clang++-18
      MIXTURE_GPU_BACKEND: vulkan
      MIXTURE_GPU_SOFTWARE: '1'
      MIXTURE_GPU_EXPECT_ADAPTER: SwiftShader
      MIXTURE_BROWSER_ARGS: '["--use-angle=swiftshader","--use-webgpu-adapter=swiftshader"]'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install build tools and Vulkan loader
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake ninja-build clang-18 libvulkan1
      - name: Fingerprint software adapter build tools
        id: swiftshader-tools
        run: |
          fingerprint=$({ clang++-18 --version; cmake --version; ninja --version; ldd --version; } | sha256sum | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore pinned software adapter build
        id: swiftshader-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tmp/swiftshader/
          key: swiftshader-${{ runner.os }}-${{ runner.arch }}-${{ steps.swiftshader-tools.outputs.fingerprint }}-${{ hashFiles('.github/scripts/setup-swiftshader.sh', '.github/workflows/gpu-smoke.yml') }}
      - name: Build pinned software adapter
        # Always verify the source revision, configure/build and export the ICD,
        # including after a cache hit. Cache contents never stand in for tests.
        run: bash .github/scripts/setup-swiftshader.sh
      - name: Save verified software adapter build
        if: steps.swiftshader-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tmp/swiftshader/
          key: ${{ steps.swiftshader-cache.outputs.cache-primary-key }}
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - name: Verify independent browser quality controls before material execution
        run: cargo xtask browser-quality-calibrate tmp/browser-quality-controls
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - run: npm install --global npm@11.19.0
      - name: Prepare exact browser binding toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Test candidate guards and build this revision's archive
        run: |
          npm ci --prefix packages/runtime --ignore-scripts
          npm test --prefix packages/runtime
          node --test scripts/browser-runtime/candidate.test.mjs scripts/browser-runtime/default-browser.test.mjs scripts/browser-runtime/consumer.test.mjs
          node scripts/browser-runtime/build.mjs
      - name: Qualify the candidate in the independent SDK consumer
        run: node scripts/browser-runtime/consumer.mjs candidate target/browser-runtime tmp/sdk-candidate
      - name: Compare scalar subtraction across native and browser execution
        run: node scripts/browser-runtime/check-subtract.mjs tmp/sdk-candidate tmp/sdk-subtract-comparison
      - name: Compare scalar morphology across native and browser execution
        run: node scripts/browser-runtime/check-morphology.mjs tmp/sdk-candidate tmp/sdk-morphology-comparison
      - name: Compare Scalar composition across native and browser execution
        run: node scripts/browser-runtime/check-scalar.mjs tmp/sdk-candidate tmp/sdk-scalar-comparison
      - name: Compare imported image resources across native and browser execution
        run: node scripts/browser-runtime/check-resources.mjs tmp/sdk-candidate tmp/sdk-resource-comparison
      - name: Compare portable package matrix across Native and browser
        run: node scripts/browser-runtime/compare-assets.mjs tmp/sdk-candidate tmp/sdk-asset-comparison
      - name: Compare the frozen brick material matrix across Native and browser
        run: node scripts/browser-runtime/check-brick.mjs tmp/sdk-candidate tmp/sdk-brick-comparison
      - name: Qualify public texture reuse, 2K costs and frozen timing budgets
        run: node scripts/browser-runtime/check-reuse.mjs tmp/sdk-candidate tmp/sdk-reuse-comparison
      - name: Qualify the exact published version separately
        run: node scripts/browser-runtime/consumer.mjs registry - tmp/sdk-registry
      - name: Prepare detached native material inputs
        run: node scripts/browser-runtime/prepare-materials.mjs tmp/browser-native "$(git rev-parse HEAD)"
      - name: Verify exact v2 to v3 material allocation migration without resetting goldens
        run: |
          cargo build --locked -p mixture-cli
          node scripts/verify-plan-v3.mjs
      - name: Check out pinned independent product
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: OpenMixture/Studio
          ref: 56c510ab57daa1b68ef660525a648a582730a37e
          path: tmp/browser-product
          persist-credentials: false
      - name: Substitute only the candidate archive and its locked identity
        run: >-
          node scripts/browser-runtime/candidate.mjs stage
          target/browser-runtime tmp/browser-product tmp/browser-candidate
          "$(git rev-parse HEAD)" 56c510ab57daa1b68ef660525a648a582730a37e
      - name: Install the exact product and browser
        working-directory: tmp/browser-product
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify installed bytes and public types, then run browser contracts
        run: |
          node scripts/browser-runtime/candidate.mjs installed tmp/browser-product tmp/browser-candidate
          cd tmp/browser-product
          npm run check
          env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES npm run test:browser
      - name: Assert actual candidate identity and reject historical WASM
        working-directory: tmp/browser-product
        run: >-
          env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES
          node "$GITHUB_WORKSPACE/scripts/browser-runtime/candidate.mjs" probe
          "$GITHUB_WORKSPACE/tmp/browser-product" "$GITHUB_WORKSPACE/tmp/browser-candidate"
      - name: Execute installed runtime against static production assets
        working-directory: tmp/browser-product
        run: env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES npm run test:materials -- ../browser-native ../browser-output
      - name: Check frozen browser quality and differences
        run: cargo xtask browser-material-check tmp/browser-native tmp/browser-output
      - name: Verify normal production deployment
        working-directory: tmp/browser-product
        run: env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES npm run test:deployment
      - name: Bind all acceptance gates to this candidate
        run: >-
          node scripts/browser-runtime/candidate.mjs verify
          tmp/browser-product tmp/browser-candidate tmp/browser-native tmp/browser-output
      - name: Prepare explicit noise-v2 material migration
        run: node scripts/browser-runtime/prepare-materials.mjs tmp/browser-native-v2 "$(git rev-parse HEAD)" --noise-v2
      - name: Requalify migrated materials through the same installed public runtime
        working-directory: tmp/browser-product
        run: env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES npm run test:materials -- ../browser-native-v2 ../browser-output-v2
      - name: Check unchanged quality gates for migrated materials
        run: cargo xtask browser-material-check tmp/browser-native-v2 tmp/browser-output-v2
      - name: Bind migrated material acceptance to the exact candidate
        run: node scripts/browser-runtime/candidate.mjs verify-noise-v2 tmp/browser-product tmp/browser-candidate tmp/browser-native-v2 tmp/browser-output-v2
      - name: Retain material qualification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chromium-material-matrix
          path: |
            target/browser-runtime/*.tgz
            target/browser-runtime/*.sha256
            target/browser-runtime/receipt.json
            tmp/browser-candidate/
            tmp/browser-native/
            tmp/browser-output/
            tmp/browser-native-v2/
            tmp/browser-output-v2/
            tmp/browser-quality-controls/
            tmp/browser-product/package-lock.json
            tmp/browser-product/test-results/
            tmp/sdk-candidate/
            tmp/sdk-scalar-comparison/
            tmp/sdk-resource-comparison/
            tmp/sdk-asset-comparison/
            tmp/sdk-brick-comparison/
            tmp/sdk-morphology-comparison/
            tmp/sdk-subtract-comparison/
            tmp/sdk-reuse-comparison/
            tmp/sdk-registry/
          retention-days: 30
          if-no-files-found: error
