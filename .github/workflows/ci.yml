name: Non-GPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: non-gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install the repository toolchain
        # rustup reads rust-toolchain.toml, including rustfmt and Clippy.
        run: rustup show active-toolchain
      - name: Restore Rust build cache
        # Speeds up rebuilds only; later steps still build and verify with --locked.
        # Only main saves, so pull requests cannot replace the shared cache.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify repository and isolated packages
        run: cargo xtask check
      - name: Verify offline evidence archive integrity and extraction guards
        run: python scripts/evidence/test_restore.py
      - name: Retain local package verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-evidence-${{ matrix.os }}
          path: tmp/package-check/
          retention-days: 30
          if-no-files-found: warn
