[package]
name = "mixture-wgpu"
description = "Typed RenderPlan execution and headless GPU diagnostics for Mixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["Cargo.toml", "src/**", "shaders/**", "README*.md", "LICENSE-*"]

[features]
software-vulkan = ["wgpu/vulkan-portability"]

[dependencies]
mixture-core.workspace = true
wgpu.workspace = true
serde.workspace = true
half.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }
futures-channel.workspace = true
web-time.workspace = true

[dev-dependencies]
naga.workspace = true
pollster.workspace = true
serde_json.workspace = true

[lints]
workspace = true
