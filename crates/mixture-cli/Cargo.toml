[package]
name = "mixture-cli"
description = "Native command-line entry point for Mixture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "README.md"
include = ["Cargo.toml", "src/**", "README*.md", "LICENSE-*"]

[[bin]]
name = "mixture"
path = "src/main.rs"

[features]
software-vulkan = ["mixture-wgpu/software-vulkan"]

[dependencies]
mixture-core.workspace = true
mixture-asset.workspace = true
mixture-wgpu.workspace = true
pollster.workspace = true
serde_json.workspace = true
serde.workspace = true
png.workspace = true

[lints]
workspace = true
