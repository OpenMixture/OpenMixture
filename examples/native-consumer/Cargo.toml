[package]
name = "mixture-native-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

# This program is an independent consumer, not a product workspace member.
[workspace]

[features]
software-vulkan = ["mixture-wgpu/software-vulkan"]

[dependencies]
mixture-asset = { path = "../../crates/mixture-asset" }
mixture-core = { path = "../../crates/mixture-core" }
mixture-wgpu = { path = "../../crates/mixture-wgpu" }
pollster = "=0.4.0"
serde_json = "=1.0.151"

[dev-dependencies]
# Decode completed CLI files in the independent contract tests only.
png = "=0.18.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
