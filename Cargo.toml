[workspace]
members = ["crates/mixture-core", "crates/mixture-wgpu", "crates/mixture-cli", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OpenMixture/OpenMixture"
publish = false

[workspace.dependencies]
mixture-core = { path = "crates/mixture-core" }
mixture-wgpu = { path = "crates/mixture-wgpu" }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pollster = "0.4.0"
half = "2.7.1"
sha2 = { version = "0.11.0", default-features = false }
png = "0.18.1"
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "serde", "wgsl"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
