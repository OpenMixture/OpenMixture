[workspace]
members = ["crates/mixture-core", "crates/mixture-wgpu", "crates/mixture-cli", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OpenMixture/OpenMixture"
publish = false

[workspace.dependencies]
mixture-core = { path = "crates/mixture-core" }
mixture-wgpu = { path = "crates/mixture-wgpu" }
pulldown-cmark = { version = "0.13.4", default-features = false }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
